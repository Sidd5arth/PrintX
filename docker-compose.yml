services:
  printx-backend:
    build:
      context: ./backend
    container_name: printx-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DB2_MOCK: "true"
      CORS_ORIGIN: "http://localhost:8080,http://localhost:5173"
      PDF_TIMEOUT_MS: 30000
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  printx-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: printx-frontend
    ports:
      - "8080:80"
    depends_on:
      printx-backend:
        condition: service_healthy
    restart: unless-stopped
