apiVersion: apps/v1
kind: Deployment
metadata:
  name: printx-frontend
  namespace: printx
  labels:
    app.kubernetes.io/name: printx-frontend
    app.kubernetes.io/part-of: printx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: printx-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: printx-frontend
        app.kubernetes.io/part-of: printx
    spec:
      containers:
        - name: frontend
          image: ghcr.io/EXAMPLE_ORG/printx-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
