apiVersion: apps/v1
kind: Deployment
metadata:
  name: printx-backend
  namespace: printx
  labels:
    app.kubernetes.io/name: printx-backend
    app.kubernetes.io/part-of: printx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: printx-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: printx-backend
        app.kubernetes.io/part-of: printx
    spec:
      containers:
        - name: backend
          image: ghcr.io/EXAMPLE_ORG/printx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: printx-config
            - secretRef:
                name: printx-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
