apiVersion: v1
kind: ConfigMap
metadata:
  name: printx-config
  namespace: printx
  labels:
    app.kubernetes.io/name: printx
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  DB2_MOCK: "false"
  DB2_SCHEMA: "PRINTX"
  CORS_ORIGIN: "https://printx.example.com"
  PDF_TIMEOUT_MS: "30000"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
