apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: printx-ingress
  namespace: printx
  labels:
    app.kubernetes.io/part-of: printx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: printx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: printx-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: printx-frontend
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - printx.example.com
  #     secretName: printx-tls
