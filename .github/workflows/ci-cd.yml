name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
        env:
          DB2_MOCK: "true"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Build & push images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: meta
        run: |
          # GHCR/Docker require lowercase repository names
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${OWNER}/printx-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER}/printx-frontend" >> "$GITHUB_OUTPUT"
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check for cluster credentials
        id: kube
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG not set — skipping Kubernetes deploy (image push still succeeded)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up kubectl
        if: steps.kube.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        if: steps.kube.outputs.configured == 'true'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if ! kubectl cluster-info; then
            echo "::error::kubectl cannot reach the cluster. Check that KUBE_CONFIG is valid base64 of a working kubeconfig."
            exit 1
          fi
      - name: Apply manifests
        if: steps.kube.outputs.configured == 'true'
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          sed -i "s|ghcr.io/EXAMPLE_ORG/printx-backend:latest|ghcr.io/${OWNER}/printx-backend:${SHA_SHORT}|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/EXAMPLE_ORG/printx-frontend:latest|ghcr.io/${OWNER}/printx-frontend:${SHA_SHORT}|g" k8s/frontend-deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n printx rollout status deployment/printx-backend --timeout=180s
          kubectl -n printx rollout status deployment/printx-frontend --timeout=180s
